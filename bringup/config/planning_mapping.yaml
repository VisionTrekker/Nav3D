planning:
  global:
    pcd_map_file: "/home/nhy/code/vscode/Nav3D/maps/campus3_no_elevator.pcd"
    octomap_output_bt: "/tmp/nav3d_global_planner_campus3_no_elevator.bt"
    octomap_resolution: 0.3
    voxel_downsample_m: 0.0
    min_points_per_voxel: 1
    min_cluster_voxels: 1
    max_endpoint_snap_distance: 2.5
    robot_radius: 0.25
    max_iterations: 800000
    snap_search_radius_cells: 12
    require_ground_support: true
    strict_direct_ground_support: false
    ground_support_xy_radius_cells: 1
    ground_support_depth_cells: 2
    enable_preblocked_costmap: true
    preblocked_costmap_radius_cells: 1
    preblocked_costmap_weight: 2.5
    lowest_traversable_only: false

  topics:
    goal_pose: "/goal_pose"
    odom: "/lio/mapping/odom_body"
    sensor_pose: "/lio/mapping/odom_body"
    cloud: "/lio/mapping/clouds_lidar"
    octomap: "/map_loader/octomap"
    global_path: "/global_planner/path"
    bspline: "/planning/bspline"
    cmd_vel: "/local_planner/cmd_vel"
    stop_requested: "/planning/stop_requested"

  scan:
    frame_id: "map"
    navi_mode: 3
    sensor_type: "lidar"
    cloud_is_world: false
    need_extrinsic: false
    body_height: 0.0

  safety:
    path_timeout_sec: 3.0
