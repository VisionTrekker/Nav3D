downsample:
  point_filter_num: 2 # 订阅点云时的降采样比例 [ 确保为正整数 ]
  blind: 0.8 # 订阅点云时忽略距离小于 blind 的点 [ 单位：m ]
  use_box_blind: false # true: 删除 LiDAR 坐标系中长方体内的自遮挡点，此时不使用球形 blind
  box_corner: # LiDAR 坐标系下长方体的 x/y/z 范围 [min, max]，单位 m
    box_corner_x: [-0.7, 0.1]
    box_corner_y: [-0.3, 0.3]
    box_corner_z: [-0.4, 0.4]
  filter_size: 0.1 # 固定模式的体素大小；自适应模式下作为初始体素大小 [m]
  # Feature 功能 —— 自适应降采样，且控制的是每秒点数而不是每帧点数，适用性较广
  adaptive:
    enable: true # 是否启用变体素大小降采样 (根据点数自动调整体素大小)
    target_points: 20000 # 目标每秒点数 [points/s] (会按输入时间戳折算到每帧)
    alpha: 1.2 # 幂律指数
    min_voxel: 0.05 # 最小体素
    max_voxel: 0.8 # 最大体素

map:
  type: "ikdtree" # 对照实验：原 Elevator-LIO 的 ikd-tree 地图
  local_map_cube_len: 1500.0 # 局部 ikd-tree 地图立方体边长 [m]，超出时清理旧地图
  ivox:
    grid_resolution: 2.0 # IVox 哈希网格边长 [m]
    nearby_type: 6 # 搜索当前网格及 6/18/26 邻域
    max_search_range: 5.0 # IVox 候选点最大搜索半径 [m]
    insert_voxel_size: 0.4 # Point-LIO 风格地图插入抑制体素 [m]
    initial_voxel_size: 0.05 # 初始地图单帧轻度去重体素 [m]

relocation:
  relocation_enable: true
  pcd_load_name: ""  # no PCD pre-load in localization mode — uses live scan context
# relocalization sub-keys below are consumed by scan_context_loop node (Task 10),
# not by lio binary — lio only reads relocation.relocation_enable from this section:
  scan_context_topic: "/lio/localization/scan_to_map_pose"
  loop_closure_topic: "/scan_context_loop/loop_closure"
  score_threshold: 0.3
  fall_back_to_initialpose: true
elevator:
  enable: false

pcd_save:
  global_map_save_enable: false # 退出时保存全局点云 [ 只在未开启重定位时有效 ]
  every_n_frame_save: -1 # 保存单帧点云（world系），每 n 帧保存一次， -1 表示不单独保存每帧pcd地图
  timestamp_prefix: true # 是否在名称前加上时间戳
  pcd_save_name: "scans.pcd" # 保存点云的名称，相对 PCD 文件夹

pub:
  global_map_pub_enable: false # 是否发布全局地图 [ 耗时较长，可视化需要，实际使用中不建议开启 ] [ 只在未开启重定位且保存全局点云时有效 ]
  ikdtree_pub_enable: true # 是否发布 ikdtree 中的点云 [ 耗时较长，可视化需要，实际使用中不建议开启 ]
  clouds_lidar_pub_every_n: 1 # lidar系当前帧点云每隔多少帧发布一次；1表示每帧发布，5表示每5帧发布一次
  high_frequency_odom: false # 是否在两帧 LiDAR 之间按 IMU 预积分状态高频发布里程计
  lidar_frequency: 10.0 # LiDAR 频率 [Hz]；启用 high_frequency_odom 时必须设置为真实频率


topic_pub:
  clouds_lidar_topic_name: "/LIO/clouds_lidar"  # lidar系当前帧点云发布的话题名
  clouds_lidar_effect_topic_name: "/LIO/clouds_lidar/effect"  # lidar系当前帧有效点云（用于拟合平面的点）
  clouds_lidar_reject_topic_name: "/LIO/clouds_lidar/reject" # lidar系当前帧认为不是平面的点（被滤除点）
  global_map_topic_name: "/LIO/global_map"  # 全局地图发布的话题名 [ 受 pub 开关影响 ]
  ikdtree_topic_name: "/LIO/ikdtree"  # ikdtree 发布的话题名 [ 受 pub 开关影响 ]
  odom_imu_topic_name: "/LIO/odom_imu"  # imu位姿发布的话题名
  odom_vehicle_topic_name: "/LIO/odom_vehicle"  # body位姿发布的话题名 如果 body_T_lidar 为单位阵，则相当于 odom_lidar

wheel:
  # Feature 功能 —— 触发式更新方法便于进行状态融合，这里保留轮速计融合代码
  wheel_enable: false # 是否启用轮速计更新

estimator:
  lidar_update_mode: "pose6" # pose6 / full27； LiDAR残差仅对位姿有直接雅可比，pose6 计算量更小
  imu_update:
    enable: true # 总开关；仅非电梯扫描超量程时局部启用 omg/acc 状态和逐 IMU LiDAR 更新
    saturation:
      gyro_limit_rad_s: 35.0 # MID360 IMU 角速度阈值 [rad/s]
      accel_limit_g: 2.0 # 当前实验阈值 [g]
      process_noise_scale: 1000.0 # 有限超限或 NaN/Inf 轴的 input 过程噪声放大倍数
    output_state:
      velocity_process_variance: 20.0
      angular_rate_process_variance: 1000.0
      acceleration_process_variance: 500.0
      gyro_bias_process_variance: 1.0e-4
      accel_bias_process_variance: 1.0e-4
      gyro_measurement_variance: 0.1
      accel_measurement_variance: 0.1
    lidar_measurement_variance: 1.0e-2 # 逐 IMU 分组点面量测方差 [m^2]
  online_gravity_estimation_enable: false # 本数据实验保持重力固定，避免与逐 IMU 分组更新形成额外变量
  lidar_ieskf:
    max_iterations: 4 # 每帧最大迭代次数
    converge_rot_rad: 1.0e-3 # 旋转收敛阈值 [rad]
    converge_pos_m: 1.0e-3 # 位置收敛阈值 [m]
    rematch_rot_rad: 2.0e-3 # 触发重新匹配的旋转阈值 [rad]
    rematch_pos_m: 2.0e-3 # 触发重新匹配的位置阈值 [m]
  ikdtree_match:
    knn: 5 # 最近邻数量
    plane_fit_rmse_threshold: 0.1 # pointlio 模式下 5 个近邻各自到拟合平面的最大距离 [m]
    neighbor_max_dist2: 3.9 # 最远邻点的最大平方距离 [m^2]；pointlio 模式按原实现不使用此项
    gate_mode: "pointlio" # pointlio：range > match_s * residual^2；另支持 linear_range / fastlio_score
    score_min: 0.95 # fastlio_score 模式的最低分数
    pointlio_match_s: 81.0 # Point-LIO 原始匹配门限系数
    match_thresh_base: 0.03 # linear_range 模式的基础残差阈值 [m]
    match_thresh_scale: 0.01 # linear_range 模式的距离缩放系数
